name: One-time Actions artifacts cleanup (2026-10-20)

on:
  push:
    branches:
      - maintenance/actions-artifact-cleanup-20261020
    paths:
      - .github/workflows/actions-artifact-cleanup-20261020.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only audited, superseded artifacts
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          echo "Cleaning audited obsolete artifacts in $repo"
          # Exact artifact IDs and original workflow run IDs inspected on 2026-10-20.
          # Latest successful APK (artifact 12246845628) and newest failed
          # checkpoints (run 39370769321) are deliberately protected.
          while read -r id expected_run expected_kind; do
            [[ -n "$id" ]] || continue
            if ! detail="$(gh api "repos/$repo/actions/artifacts/$id" 2>/dev/null)"; then
              echo "SKIP: artifact $id no longer exists."
              continue
            fi
            name="$(jq -r '.name' <<<"$detail")"
            actual_run="$(jq -r '.workflow_run.id // "missing"' <<<"$detail")"
            if [[ "$actual_run" != "$expected_run" ]]; then
              echo "::warning::SKIP $id: run mismatch ($actual_run vs $expected_run)"
              continue
            fi
            case "$expected_kind" in
              checkpoint)
                [[ "$name" == "archium-checkpoint-$expected_run-"* ]] || {
                  echo "::warning::SKIP $id: name mismatch ($name)"
                  continue
                }
                ;;
              apk)
                [[ "$name" == "Archium-for-Android-arm64" ]] || {
                  echo "::warning::SKIP $id: name mismatch ($name)"
                  continue
                }
                ;;
              *)
                echo "::error::Invalid cleanup category"
                exit 1
                ;;
            esac
            echo "DELETE $id $name from run $actual_run"
            gh api --method DELETE "repos/$repo/actions/artifacts/$id"
            echo "DELETED $id"
          done <<'ARTIFACTS'
          11872500508 38511423805 checkpoint
          11871884143 38511423805 checkpoint
          11871749444 38511423805 checkpoint
          11871517881 38511423805 checkpoint
          12240041500 39362104801 checkpoint
          12239952113 39362104801 checkpoint
          12239776646 39362104801 checkpoint
          12239517989 39362104801 checkpoint
          12214336151 39296066030 apk
          12194551744 39259086848 apk
          11874653160 38519244024 apk
          11918592218 38602932971 apk
          ARTIFACTS
          echo "Completed allowlisted cleanup."
