name: Archium R5 Arc experience incremental build
run-name: Archium R5 ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique monitor dispatch nonce
        required: false
        default: manual
        type: string
      skip_preflight:
        description: Reuse same-source preflight only with a verified controlled checkpoint
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact reviewed recovery SHA
        required: true
        type: string
      source_checkpoint:
        description: Complete checkpoint tag; no clean fallback
        required: true
        type: string
      source_commit:
        description: Exact checkpoint source SHA
        required: true
        type: string
      source_run_id:
        description: Run containing those checkpoint artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: archium-native-Jorgeprdz-chromium-dex-arc
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject wrong branch or moving SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = assistant/archium-r5-arc-experience
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Reject concurrent native workflow from historical branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > "$RUNNER_TEMP/native-runs.json"
          python3 - "$RUNNER_TEMP/native-runs.json" <<'PY'
          import json, os, sys
          active = [r['id'] for r in json.load(open(sys.argv[1]))['workflow_runs']
                    if r['status'] in ('in_progress', 'queued', 'waiting', 'pending')
                    and str(r['id']) != os.environ['GITHUB_RUN_ID']]
          if active:
              raise SystemExit('Concurrent native run rejected: ' + str(active))
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: inputs.skip_preflight
        with:
          persist-credentials: false
      - name: Authenticate exact same-source continuation
        if: inputs.skip_preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_CHECKPOINT: ${{ inputs.source_checkpoint }}
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = "$EXPECTED_SHA"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Archium-R5-stage-receipt --dir "$RUNNER_TEMP/continuation"
          python3 scripts/check-r5-continuation.py --receipt "$RUNNER_TEMP/continuation/stage-receipt.json" --expected-sha "$EXPECTED_SHA" --source-checkpoint "$SOURCE_CHECKPOINT" --source-run-id "$SOURCE_RUN_ID"
  preflight:
    needs: authorize
    if: ${{ !inputs.skip_preflight }}
    uses: ./.github/workflows/archium-r5-preflight.yml
  build:
    needs: [authorize, preflight]
    if: ${{ always() && needs.authorize.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    uses: ./.github/workflows/archium-r5-stage.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      source_checkpoint: ${{ inputs.source_checkpoint }}
      source_commit: ${{ inputs.source_commit }}
      source_run_id: ${{ inputs.source_run_id }}
  qemu:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/archium-r5-qemu.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
