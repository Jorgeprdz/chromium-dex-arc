name: Chromium Android Desktop baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-baseline
  cancel-in-progress: false

jobs:
  bootstrap-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bootstrap pinned depot_tools and exercise GN interpreter
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" fetch --depth 1 origin 8a5434051036b32412a2ecb10c213a72e3f3ccb9
          git -C "$RUNNER_TEMP/depot_tools" checkout --detach 8a5434051036b32412a2ecb10c213a72e3f3ccb9
          export DEPOT_TOOLS_UPDATE=0
          printf 'Before bootstrap (expected missing interpreter metadata):\n'
          if "$RUNNER_TEMP/depot_tools/python-bin/python3" --version; then
            printf 'Fresh tool checkout already initialized.\n'
          fi
          bash "$RUNNER_TEMP/depot_tools/ensure_bootstrap"
          printf 'After bootstrap (must succeed):\n'
          "$RUNNER_TEMP/depot_tools/python-bin/python3" --version
  build:
    needs: bootstrap-check
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout preparation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Chromium without UI changes
        run: bash scripts/build-baseline.sh
      - name: Preserve successful baseline as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "baseline-${GITHUB_RUN_ID}" baseline-output/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Unmodified Chromium Desktop baseline 1710899" \
            --notes "Build feasibility baseline only. This APK has no Arc UI and uses Chromium's original application ID and test signing. Do not install over an existing Chromium profile."
