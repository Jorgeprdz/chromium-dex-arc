name: Archium for Android build in resumable stages
on:
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: 'Explicit checkpoint tag from the previous implementation; empty for clean build'
        type: string
        default: ''
      source_commit:
        description: 'Exact 40-character commit that produced source_checkpoint'
        type: string
        default: ''
      validate_native:
        description: 'Compile targeted native/Java checks before the final APK'
        type: boolean
        default: true
  push:
    branches:
      - feat/arc-desktop
    paths:
      - .archium-final-dispatch
permissions:
  contents: write
concurrency:
  group: archium-build-staged
  cancel-in-progress: false
jobs:
  stage1:
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 1
      source_tag: ${{ github.event_name == 'push' && 'archium-checkpoint-37255997027-7' || inputs.source_checkpoint }}
      source_commit: ${{ github.event_name == 'push' && 'c8ffd13ee7fe1c6baab4913da6a01e8009febe18' || inputs.source_commit }}
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 2
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-1
  stage3:
    needs: stage2
    if: needs.stage2.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 3
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-2
  stage4:
    needs: stage3
    if: needs.stage3.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 4
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-3
  stage5:
    needs: stage4
    if: needs.stage4.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 5
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-4
  stage6:
    needs: stage5
    if: needs.stage5.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 6
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-5
  stage7:
    needs: stage6
    if: needs.stage6.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 7
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-6
  stage8:
    needs: stage7
    if: needs.stage7.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 8
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-7
  stage9:
    needs: stage8
    if: needs.stage8.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 9
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-8
  stage10:
    needs: stage9
    if: needs.stage9.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 10
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-9
  stage11:
    needs: stage10
    if: needs.stage10.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 11
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-10
  stage12:
    needs: stage11
    if: needs.stage11.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 12
      validate_native: ${{ github.event_name == 'push' || inputs.validate_native }}
      previous_tag: archium-checkpoint-${{ github.run_id }}-11
  result:
    needs: stage12
    if: needs.stage12.outputs.complete == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Report resumable unfinished build
        run: |
          echo 'All 12 compilation slices consumed. Latest checkpoint remains available for continuation.' >&2
          exit 1
