name: Chromium Android Desktop baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-baseline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout preparation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Chromium without UI changes
        run: bash scripts/build-baseline.sh
      - name: Preserve successful baseline as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "baseline-${GITHUB_RUN_ID}" baseline-output/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Unmodified Chromium Desktop baseline 1710899" \
            --notes "Build feasibility baseline only. This APK has no Arc UI and uses Chromium's original application ID and test signing. Do not install over an existing Chromium profile."
