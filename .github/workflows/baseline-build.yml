name: Archium for Android build in resumable stages
on:
  workflow_dispatch:
    inputs:
      source_checkpoint:
        description: 'Explicit checkpoint tag from the previous implementation; empty for clean build'
        type: string
        default: ''
      source_commit:
        description: 'Exact 40-character commit that produced source_checkpoint'
        type: string
        default: ''
  push:
    branches:
      - feat/arc-desktop
      - assistant/archium-r3-visual-fixes
    paths:
      - .archium-final-dispatch
      # Only a dedicated, explicitly committed marker triggers the R3.3 run.
      - .archium-r3-3-final-dispatch
      - .archium-r3-3-incremental-dispatch
permissions:
  contents: write
concurrency:
  group: archium-build-staged
  cancel-in-progress: false
jobs:
  r3-final-gates:
    if: github.ref_name == 'assistant/archium-r3-visual-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Reading historical *draft* checkpoint releases needs contents: write.
      # The job only downloads a signed manifest and never mutates releases.
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Block overlapping native build and unapproved checkpoint reuse
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = 'push' || test "${{ inputs.source_checkpoint }}" = ''
          test "${{ inputs.source_commit }}" = ''
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/37987348539" --jq '.status')" = 'completed'
          test "$GITHUB_REF_NAME" = 'assistant/archium-r3-visual-fixes'
      - name: Confirm reusable historical checkpoint exists before compilation
        env:
          SOURCE_TAG: archium-checkpoint-37807259506-1
          SOURCE_COMMIT: 33db26aa6fad2e8a9ac9ccf26774605edb9db771
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archium-source-probe"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern checkpoint.json --dir "$RUNNER_TEMP/archium-source-probe"
          python3 - "$RUNNER_TEMP/archium-source-probe/checkpoint.json" "$SOURCE_COMMIT" <<'PY'
          import json, re, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          assert data.get("commit") == sys.argv[2]
          assert data.get("revision") == "cfd94726b7b5fb48aedcc32662f2f3fbdbadec35"
          parts=data.get("parts", [])
          assert 1 <= len(parts) <= 64
          assert all(0 < p.get("bytes", 0) <= 1024**3 and re.fullmatch("[0-9a-f]{64}", p.get("sha256", "")) for p in parts)
          print("REUSABLE_SOURCE_MANIFEST=PASS:", len(parts), "parts; full restore still checked later")
          PY
      - name: Verify source preservation and exact Portal identities
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_archium_portal_resources.py'
          python3 -m unittest discover -s tests -p 'test_r3_3_portal_safe_zone.py'
          python3 -m unittest discover -s tests -p 'test_r3_3_portal_apk_content.py'
          python3 scripts/generate-arc-patch.py
          git diff --exit-code -- patches/archium-desktop.patch patches/upstream-files.json
          python3 -m compileall -q scripts/archium_portal_content_gate.py scripts/verify-archium-portal-apk.py
  stage1:
    needs: r3-final-gates
    if: always() && (needs.r3-final-gates.result == 'success' || github.ref_name != 'assistant/archium-r3-visual-fixes')
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 1
      source_tag: ${{ github.event_name == 'push' && github.ref_name == 'assistant/archium-r3-visual-fixes' && 'archium-checkpoint-37807259506-1' || (github.event_name == 'push' && github.ref_name == 'feat/arc-desktop' && 'archium-checkpoint-37255997027-7' || inputs.source_checkpoint) }}
      source_commit: ${{ github.event_name == 'push' && github.ref_name == 'assistant/archium-r3-visual-fixes' && '33db26aa6fad2e8a9ac9ccf26774605edb9db771' || (github.event_name == 'push' && github.ref_name == 'feat/arc-desktop' && 'c8ffd13ee7fe1c6baab4913da6a01e8009febe18' || inputs.source_commit) }}
  stage2:
    needs: stage1
    if: needs.stage1.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 2
      previous_tag: archium-checkpoint-${{ github.run_id }}-1
  stage3:
    needs: stage2
    # R3.3 deliberately stops after two bounded slices instead of 12*2h.
    if: github.ref_name != 'assistant/archium-r3-visual-fixes' && needs.stage2.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 3
      previous_tag: archium-checkpoint-${{ github.run_id }}-2
  stage4:
    needs: stage3
    if: needs.stage3.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 4
      previous_tag: archium-checkpoint-${{ github.run_id }}-3
  stage5:
    needs: stage4
    if: needs.stage4.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 5
      previous_tag: archium-checkpoint-${{ github.run_id }}-4
  stage6:
    needs: stage5
    if: needs.stage5.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 6
      previous_tag: archium-checkpoint-${{ github.run_id }}-5
  stage7:
    needs: stage6
    if: needs.stage6.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 7
      previous_tag: archium-checkpoint-${{ github.run_id }}-6
  stage8:
    needs: stage7
    if: needs.stage7.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 8
      previous_tag: archium-checkpoint-${{ github.run_id }}-7
  stage9:
    needs: stage8
    if: needs.stage8.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 9
      previous_tag: archium-checkpoint-${{ github.run_id }}-8
  stage10:
    needs: stage9
    if: needs.stage9.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 10
      previous_tag: archium-checkpoint-${{ github.run_id }}-9
  stage11:
    needs: stage10
    if: needs.stage10.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 11
      previous_tag: archium-checkpoint-${{ github.run_id }}-10
  stage12:
    needs: stage11
    if: needs.stage11.outputs.complete != 'true'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 12
      previous_tag: archium-checkpoint-${{ github.run_id }}-11
  r3-incomplete-budget:
    needs: stage2
    if: github.ref_name == 'assistant/archium-r3-visual-fixes' && needs.stage2.outputs.complete == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail visibly after two bounded slices; preserve verified checkpoint artifacts
        run: |
          echo 'R3.3 stopped at configured incremental build budget; no APK. Resume only from verified checkpoint artifacts.' >&2
          exit 1
  result:
    needs: stage12
    if: needs.stage12.outputs.complete == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Report resumable unfinished build
        run: |
          echo 'All 12 compilation slices consumed. Latest checkpoint remains available for continuation.' >&2
          exit 1
