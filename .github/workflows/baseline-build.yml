name: Archium for Android build in resumable stages
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact authorized implementation SHA; must equal the dispatched ref'
        required: true
        type: string
      source_checkpoint:
        description: 'Verified incremental checkpoint; clean builds are forbidden'
        required: true
        type: string
        default: archium-checkpoint-38147216573-1
      source_commit:
        description: 'Exact commit that produced the checkpoint'
        required: true
        type: string
        default: 5895d4a80510114ef12a89927c19667d4defeb27
      source_run_id:
        description: 'Actions run containing the verified checkpoint groups'
        required: true
        type: string
        default: '38147216573'
permissions:
  contents: write
  actions: read
concurrency:
  group: archium-build-staged
  cancel-in-progress: false
jobs:
  r3-final-gates:
    if: github.ref_name == 'assistant/archium-r3-visual-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Reading historical *draft* checkpoint releases needs contents: write.
      # The job only downloads a signed manifest and never mutates releases.
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Block overlapping native build and unapproved checkpoint reuse
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_NAME" = 'assistant/archium-r3-visual-fixes'
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python3 - <<'PYRUN'
          import json, os, re, subprocess
          assert re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_SHA'])
          repo = os.environ['GITHUB_REPOSITORY']
          runs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs?per_page=100']))['workflow_runs']
          active = [r for r in runs if r['id'] != int(os.environ['GITHUB_RUN_ID'])
                    and r['status'] != 'completed' and r['name'] == 'Archium for Android build in resumable stages']
          assert not active, 'Another native build exists; do not overlap'
          PYRUN
      - name: Confirm R3.3 Actions checkpoint is complete before large download
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_checkpoint }}
        run: |
          set -euo pipefail
          test "$SOURCE_TAG" = "archium-checkpoint-${SOURCE_RUN_ID}-1"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_sha')" = "$SOURCE_COMMIT"
          mkdir -p "$RUNNER_TEMP/archium-source-probe"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/archium-source-probe/artifacts.json"
          python3 - "$RUNNER_TEMP/archium-source-probe/artifacts.json" "$SOURCE_RUN_ID" "$SOURCE_COMMIT" <<'PY'
          import json, sys
          from pathlib import Path
          artifacts = json.loads(Path(sys.argv[1]).read_text())['artifacts']
          prefix = 'archium-checkpoint-' + sys.argv[2] + '-1-'
          selected = [a for a in artifacts if a['name'].startswith(prefix)]
          expected = {prefix + suffix for suffix in ('00', '01', '02')}
          assert {a['name'] for a in selected} == expected, 'Missing/extra checkpoint group'
          assert all(not a['expired'] and 0 < a['size_in_bytes'] < 10 * 1024**3
                     and a['workflow_run']['head_sha'] == sys.argv[3]
                     for a in selected), 'Invalid checkpoint group'
          print('R3_CHECKPOINT_METADATA=PASS groups=3; byte/hash verification follows on restore')
          PY
      - name: Verify source preservation and exact Portal identities
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-pil webp
          python3 -c 'from PIL import features; assert features.check("webp"), "Lossless WebP decoder required"'
          python3 -m unittest discover -s tests -p 'test_archium_portal_resources.py'
          python3 -m unittest discover -s tests -p 'test_r3_3_portal_safe_zone.py'
          python3 -m unittest discover -s tests -p 'test_r3_3_portal_apk_content.py'
          python3 scripts/generate-arc-patch.py
          git diff --exit-code -- patches/archium-desktop.patch patches/upstream-files.json
          python3 -m compileall -q scripts/archium_portal_content_gate.py scripts/verify-archium-portal-apk.py
  r3-pre-native-gates:
    needs: r3-final-gates
    if: github.ref_name == 'assistant/archium-r3-visual-fixes' && needs.r3-final-gates.result == 'success'
    uses: ./.github/workflows/archium-r3-preflight.yml
    permissions:
      contents: read
  stage1:
    needs: [r3-final-gates, r3-pre-native-gates]
    if: github.ref_name == 'assistant/archium-r3-visual-fixes' && needs.r3-final-gates.result == 'success' && needs.r3-pre-native-gates.result == 'success'
    uses: ./.github/workflows/archium-stage.yml
    with:
      stage: 1
      source_tag: ${{ inputs.source_checkpoint }}
      source_commit: ${{ inputs.source_commit }}
      source_run_id: ${{ inputs.source_run_id }}
  r3-incomplete-budget:
    needs: stage1
    if: needs.stage1.result == 'success' && needs.stage1.outputs.complete == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Report BUILD_INCOMPLETE with preserved checkpoint
        run: |
          echo 'BUILD_INCOMPLETE: bounded slices consumed; no verified APK. Checkpoint retained.' >&2
          exit 1
