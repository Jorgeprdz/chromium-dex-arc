name: Archium recovery native stage
on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      source_checkpoint:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIUM_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ARCHIUM_SOURCE_TAG: ${{ inputs.source_checkpoint }}
      ARCHIUM_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIUM_CHECKPOINT_STORAGE: artifact
      ARCHIUM_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ARCHIUM_CHECKPOINT_TAG: archium-checkpoint-${{ github.run_id }}-1
      ARCHIUM_SLICE_MINUTES: '75'
      ARCHIUM_MAX_SLICES: '2'
      ARCHIUM_CHECKPOINT_SECONDS: '3600'
      ARCHIUM_UPLOAD_RESERVE_SECONDS: '1200'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: S0 source, capacity and bounded checkpoint manifest
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = assistant/archium-r4-recovery
          test "$ARCHIUM_EXPECTED_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARCHIUM_SOURCE_TAG" =~ ^archium-checkpoint-$SOURCE_RUN_ID-[0-9]+$ ]]
          echo "ARCHIUM_JOB_DEADLINE_EPOCH=$(( $(date +%s) + 10500 ))" >> "$GITHUB_ENV"
          echo "ARCHIUM_CHECKPOINT_DIR=$RUNNER_TEMP/archium-checkpoint" >> "$GITHUB_ENV"
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y python3-requests python3-pil webp
          # Disposable CI image only; no restored source/output/cache is deleted.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -B1 "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json, os, sys
          assert json.load(open(sys.argv[1]))['head_sha'] == os.environ['ARCHIUM_SOURCE_COMMIT'], 'Source run SHA differs'
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/checkpoint-artifacts.json"
          python3 scripts/check-recovery-checkpoint.py --artifacts "$RUNNER_TEMP/checkpoint-artifacts.json" --source-tag "$ARCHIUM_SOURCE_TAG" --source-sha "$ARCHIUM_SOURCE_COMMIT" --report "$RUNNER_TEMP/checkpoint-preflight.json"
      - name: S1 download exactly the verified checkpoint groups
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.source_checkpoint }}-*
          run-id: ${{ fromJSON(inputs.source_run_id) }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/archium-checkpoint
      - name: S1 restore once and transition patches
        timeout-minutes: 62
        run: bash scripts/build-archium-recovery.sh --prepare
      - name: S2-S4 blocking gates and incremental build
        id: compile
        run: bash scripts/build-archium-recovery.sh --work
      - name: Preserve checkpoint group 00
        if: always() && steps.compile.outputs.saved_group_00 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-00
          path: ${{ runner.temp }}/archium-checkpoint/group-00/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 01
        if: always() && steps.compile.outputs.saved_group_01 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-01
          path: ${{ runner.temp }}/archium-checkpoint/group-01/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 02
        if: always() && steps.compile.outputs.saved_group_02 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-02
          path: ${{ runner.temp }}/archium-checkpoint/group-02/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 03
        if: always() && steps.compile.outputs.saved_group_03 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-03
          path: ${{ runner.temp }}/archium-checkpoint/group-03/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 04
        if: always() && steps.compile.outputs.saved_group_04 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-04
          path: ${{ runner.temp }}/archium-checkpoint/group-04/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 05
        if: always() && steps.compile.outputs.saved_group_05 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-05
          path: ${{ runner.temp }}/archium-checkpoint/group-05/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 06
        if: always() && steps.compile.outputs.saved_group_06 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-06
          path: ${{ runner.temp }}/archium-checkpoint/group-06/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 07
        if: always() && steps.compile.outputs.saved_group_07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-1-07
          path: ${{ runner.temp }}/archium-checkpoint/group-07/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: S5 publish verified APK
        id: publish
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-for-Android-arm64
          path: archium-output/
          if-no-files-found: error
          retention-days: 7
      - name: Reject incomplete budget as a successful build
        if: steps.compile.outputs.complete == 'false'
        run: |
          echo 'BUILD_INCOMPLETE: checkpoint preserved; APK gates remain pending.' >&2
          exit 1

      - name: S5 verify uploaded artifact metadata
        if: steps.publish.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/published-artifact.json"
          python3 scripts/verify-archium-artifact.py "$RUNNER_TEMP/published-artifact.json"
