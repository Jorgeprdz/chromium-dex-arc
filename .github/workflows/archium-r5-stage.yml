name: Archium R5 native stage
on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      source_checkpoint:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      chain_mode:
        type: boolean
        default: false
      stage_number:
        type: number
        default: 1
      source_manifest_artifact:
        type: string
        default: ''
      source_manifest_sha256:
        type: string
        default: ''
    outputs:
      outcome:
        value: ${{ jobs.build.outputs.outcome }}
      new_checkpoint:
        value: ${{ jobs.build.outputs.new_checkpoint }}
      manifest_sha256:
        value: ${{ jobs.build.outputs.manifest_sha256 }}
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      outcome: ${{ steps.qualify.outputs.outcome }}
      new_checkpoint: ${{ steps.qualify.outputs.new_checkpoint }}
      manifest_sha256: ${{ steps.qualify.outputs.manifest_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIUM_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ARCHIUM_SOURCE_TAG: ${{ inputs.source_checkpoint }}
      ARCHIUM_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIUM_CHECKPOINT_STORAGE: artifact
      ARCHIUM_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ARCHIUM_CHECKPOINT_TAG: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}
      ARCHIUM_SLICE_MINUTES: '120'
      ARCHIUM_MAX_SLICES: ${{ inputs.chain_mode && '1' || '2' }}
      ARCHIUM_STAGE_WORK_SECONDS: ${{ inputs.chain_mode && '7200' || '' }}
      ARCHIUM_CHECKPOINT_SECONDS: '3600'
      ARCHIUM_UPLOAD_RESERVE_SECONDS: '1200'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: S0 source, capacity and bounded checkpoint manifest
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_MANIFEST_ARTIFACT: ${{ inputs.source_manifest_artifact }}
          SOURCE_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = assistant/archium-r5-desktop-native-mobile
          test "$ARCHIUM_EXPECTED_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARCHIUM_SOURCE_TAG" =~ ^archium-checkpoint-$SOURCE_RUN_ID-[0-9]+$ ]]
          echo "ARCHIUM_JOB_DEADLINE_EPOCH=$(( $(date +%s) + 21300 ))" >> "$GITHUB_ENV"
          echo "ARCHIUM_CHECKPOINT_DIR=$RUNNER_TEMP/archium-checkpoint" >> "$GITHUB_ENV"
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y python3-requests python3-pil webp
          # Disposable CI image only; no restored source/output/cache is deleted.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -B1 "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json, os, sys
          assert json.load(open(sys.argv[1]))['head_sha'] == os.environ['ARCHIUM_SOURCE_COMMIT'], 'Source run SHA differs'
          PY
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/checkpoint-pages.json"
          python3 - "$RUNNER_TEMP" <<'PYJSON'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);pages=json.loads((d/'checkpoint-pages.json').read_text())
          (d/'checkpoint-artifacts.json').write_text(json.dumps({'artifacts':[a for page in pages for a in page['artifacts']]}))
          PYJSON
          manifest_args=()
          if [[ -n "$SOURCE_MANIFEST_ARTIFACT" ]]; then
            [[ "$SOURCE_MANIFEST_ARTIFACT" =~ ^Archium-R5-checkpoint-manifest-[0-9]+$ ]]
            [[ "$SOURCE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_MANIFEST_ARTIFACT" --dir "$RUNNER_TEMP/source-manifest"
            manifest_args=(--manifest "$RUNNER_TEMP/source-manifest/checkpoint.json" --manifest-sha256 "$SOURCE_MANIFEST_SHA256")
          fi
          python3 scripts/check-recovery-checkpoint.py --artifacts "$RUNNER_TEMP/checkpoint-artifacts.json" --source-tag "$ARCHIUM_SOURCE_TAG" --source-sha "$ARCHIUM_SOURCE_COMMIT" --report "$RUNNER_TEMP/checkpoint-preflight.json" "${manifest_args[@]}"
      - name: S1 download exactly the verified checkpoint groups
        timeout-minutes: 100
        run: |
          python3 scripts/download-r5-checkpoint.py --artifacts "$RUNNER_TEMP/checkpoint-artifacts.json" --preflight "$RUNNER_TEMP/checkpoint-preflight.json" --directory "$ARCHIUM_CHECKPOINT_DIR"
      - name: S1 restore once and transition patches
        timeout-minutes: 62
        run: bash scripts/build-archium-r5.sh --prepare
      - name: Retire redundant chain checkpoints after verified restore
        if: inputs.chain_mode && inputs.stage_number > 3
        env:
          NUMBER: ${{ inputs.stage_number }}
        run: python3 scripts/r5-chain.py prune --number "$NUMBER" --directory "$RUNNER_TEMP"
      - name: S2-S4 blocking gates and incremental build
        id: compile
        run: bash scripts/build-archium-r5.sh --work
      - name: Record genuine failure if no native receipt exists
        if: always()
        run: |
          python3 scripts/r5-stage-receipt.py --out "$RUNNER_TEMP/chromium-archium/checkout/src/out/Archium" --receipt "$RUNNER_TEMP/stage-receipt.json" --exit-code 1 --only-if-absent
      - name: Publish bounded transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archium-R5-transport-diagnostics-${{ inputs.stage_number }}
          path: |
            ${{ runner.temp }}/checkpoint-cleanup.json
            ${{ runner.temp }}/checkpoint-preflight.json
            ${{ runner.temp }}/archium-checkpoint-transfers/*.progress.json
            ${{ runner.temp }}/archium-checkpoint-transfers/*.identity.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish exact stage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.chain_mode && format('Archium-R5-stage-receipt-{0}', inputs.stage_number) || 'Archium-R5-stage-receipt' }}
          path: ${{ runner.temp }}/stage-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve checkpoint group 00
        if: always() && steps.compile.outputs.saved_group_00 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-00
          path: ${{ runner.temp }}/archium-checkpoint/group-00/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 01
        if: always() && steps.compile.outputs.saved_group_01 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-01
          path: ${{ runner.temp }}/archium-checkpoint/group-01/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 02
        if: always() && steps.compile.outputs.saved_group_02 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-02
          path: ${{ runner.temp }}/archium-checkpoint/group-02/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 03
        if: always() && steps.compile.outputs.saved_group_03 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-03
          path: ${{ runner.temp }}/archium-checkpoint/group-03/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 04
        if: always() && steps.compile.outputs.saved_group_04 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-04
          path: ${{ runner.temp }}/archium-checkpoint/group-04/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 05
        if: always() && steps.compile.outputs.saved_group_05 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-05
          path: ${{ runner.temp }}/archium-checkpoint/group-05/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 06
        if: always() && steps.compile.outputs.saved_group_06 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-06
          path: ${{ runner.temp }}/archium-checkpoint/group-06/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve checkpoint group 07
        if: always() && steps.compile.outputs.saved_group_07 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage_number }}-07
          path: ${{ runner.temp }}/archium-checkpoint/group-07/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish small manifest for the next stage
        if: inputs.chain_mode && steps.compile.outputs.complete == 'false' && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-R5-checkpoint-manifest-${{ inputs.stage_number }}
          path: ${{ runner.temp }}/archium-checkpoint/group-00/checkpoint.json
          if-no-files-found: error
          retention-days: 14
      - name: Qualify checkpoint and measurable progress before continuation
        id: qualify
        if: inputs.chain_mode
        env:
          NUMBER: ${{ inputs.stage_number }}
        run: |
          set -euo pipefail
          previous_args=()
          if (( NUMBER > 1 )); then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "Archium-R5-stage-receipt-$((NUMBER-1))" --dir "$RUNNER_TEMP/previous-stage"
            previous_args=(--previous "$RUNNER_TEMP/previous-stage/stage-receipt.json")
          fi
          python3 scripts/r5-chain.py qualify --receipt "$RUNNER_TEMP/stage-receipt.json" --number "$NUMBER" "${previous_args[@]}" --manifest "$ARCHIUM_CHECKPOINT_DIR/group-00/checkpoint.json" --output "$GITHUB_OUTPUT"
      - name: S5 publish verified APK
        id: publish
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-for-Android-arm64
          path: archium-output/
          if-no-files-found: error
          retention-days: 7
      - name: Reject incomplete budget as a successful build
        if: ${{ !inputs.chain_mode && steps.compile.outputs.complete == 'false' }}
        run: |
          echo 'BUILD_INCOMPLETE: checkpoint preserved; APK gates remain pending.' >&2
          exit 1

      - name: S5 verify uploaded artifact metadata
        if: steps.publish.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/published-artifact.json"
          python3 scripts/verify-archium-artifact.py "$RUNNER_TEMP/published-artifact.json"
