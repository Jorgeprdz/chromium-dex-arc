name: Archium preflight and patch refresh

on:
  push:
    branches:
      - feat/arc-desktop
    paths:
      - .archium-preflight

permissions:
  contents: write

concurrency:
  group: archium-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/arc-desktop
          fetch-depth: 0
          persist-credentials: true

      - name: Install Android 36 platform if needed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-36" >/dev/null
          sdk_rc=${PIPESTATUS[1]}
          set -o pipefail
          exit "$sdk_rc"

      - name: Run preparation gates and refresh patch
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p docs/validation
          LOG="$RUNNER_TEMP/archium-preflight.log"
          {
            set -x
            python3 scripts/generate-arc-patch.py &&
            python3 scripts/check-arc-preparation.py \
              --android-jar "${ANDROID_HOME}/platforms/android-36/android.jar" &&
            python3 -m unittest discover -s tests -p 'test_*.py' &&
            git diff --check -- . ':!patches/archium-desktop.patch' &&
            bash -n scripts/build-archium.sh
          } >"$LOG" 2>&1
          rc=$?
          if [[ $rc -eq 0 ]]; then result=PASS; else result=FAIL; fi
          {
            echo '# Archium preflight'
            echo
            echo "Result: $result"
            echo "Trigger commit: $GITHUB_SHA"
            echo
            echo '```text'
            tail -n 160 "$LOG"
            echo '```'
          } > docs/validation/preflight-ci.md
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit refreshed patch, manifest and preflight result
        shell: bash
        run: |
          set -euo pipefail
          git add patches/archium-desktop.patch patches/upstream-files.json \
            docs/validation/preflight-ci.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git config user.name 'Archium CI'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'build: refresh Archium patch and preflight'
            git push origin HEAD:feat/arc-desktop
          fi
          test "${{ steps.gates.outputs.result }}" = PASS
