name: Archium resumable compilation stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      previous_tag:
        required: false
        default: ''
        type: string
      source_tag:
        required: false
        default: ''
        type: string
      source_commit:
        required: false
        default: ''
        type: string
    outputs:
      complete:
        value: ${{ jobs.build.outputs.complete }}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIUM_SOURCE_TAG: ${{ inputs.source_tag }}
      ARCHIUM_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIUM_COMPILE_GATE_TARGETS: 'archium_key_provider_tests archium_key_java archium_login_database_tests archium_password_import_tests archium_password_manager_tests archium_password_csv_java chrome_junit_tests'
      ARCHIUM_RUN_HOST_GATES: 'true'
      ARCHIUM_PREVIOUS_TAG: ${{ inputs.previous_tag }}
      ARCHIUM_CHECKPOINT_TAG: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}
      ARCHIUM_CHECKPOINT_STORAGE: artifact
      # Stop compilation after 75m per stage; never run a 20-hour chain on R3.3.
      ARCHIUM_SLICE_MINUTES: '75'
      ARCHIUM_PREPARE_SECONDS: '3600'
      ARCHIUM_WORK_SECONDS: '7200'
      ARCHIUM_HOST_SECONDS: '1800'
      ARCHIUM_CHECKPOINT_SECONDS: '5400'
    outputs:
      complete: ${{ steps.compile.outputs.complete }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download complete checkpoint artifact groups
        if: inputs.previous_tag != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.previous_tag }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/archium-checkpoint
      - name: Restore checkpoint and prepare Chromium
        timeout-minutes: 62
        env:
          ARCHIUM_CHECKPOINT_DIR: ${{ runner.temp }}/archium-checkpoint
        run: bash scripts/build-archium.sh --prepare
      - name: Compile, run gates and checkpoint
        id: compile
        env:
          ARCHIUM_CHECKPOINT_DIR: ${{ runner.temp }}/archium-checkpoint
        run: bash scripts/build-archium.sh --work
      - name: Upload checkpoint artifact group 00
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-00
          path: ${{ runner.temp }}/archium-checkpoint/group-00/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 01
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-01
          path: ${{ runner.temp }}/archium-checkpoint/group-01/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 02
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-02
          path: ${{ runner.temp }}/archium-checkpoint/group-02/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 03
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-03
          path: ${{ runner.temp }}/archium-checkpoint/group-03/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 04
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-04
          path: ${{ runner.temp }}/archium-checkpoint/group-04/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 05
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-05
          path: ${{ runner.temp }}/archium-checkpoint/group-05/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 06
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-06
          path: ${{ runner.temp }}/archium-checkpoint/group-06/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 07
        if: steps.compile.outputs.complete == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-07
          path: ${{ runner.temp }}/archium-checkpoint/group-07/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Save completed APK
        timeout-minutes: 30
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-for-Android-arm64
          path: archium-output/
          if-no-files-found: error
          retention-days: 7
