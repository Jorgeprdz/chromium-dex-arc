name: Archium resumable compilation stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      previous_tag:
        required: false
        default: ''
        type: string
    outputs:
      complete:
        value: ${{ jobs.build.outputs.complete }}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      complete: ${{ steps.compile.outputs.complete }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile for two hours and checkpoint
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIUM_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          ARCHIUM_CHECKPOINT_TAG: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}
          ARCHIUM_SLICE_MINUTES: '120'
        run: bash scripts/build-archium.sh
      - name: Save completed APK
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-for-Android-arm64
          path: archium-output/
          if-no-files-found: error
          retention-days: 7
