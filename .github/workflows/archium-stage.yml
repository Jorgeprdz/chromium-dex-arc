name: Archium resumable compilation stage
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
      previous_tag:
        required: false
        default: ''
        type: string
      source_tag:
        required: false
        default: ''
        type: string
      source_commit:
        required: false
        default: ''
        type: string
      source_run_id:
        required: false
        default: ''
        type: string
    outputs:
      complete:
        value: ${{ jobs.build.outputs.complete }}
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIUM_SOURCE_TAG: ${{ inputs.source_tag }}
      ARCHIUM_SOURCE_COMMIT: ${{ inputs.source_commit }}
      ARCHIUM_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ARCHIUM_COMPILE_GATE_TARGETS: 'archium_key_provider_tests archium_key_java archium_login_database_tests archium_password_import_tests archium_password_manager_tests archium_password_csv_java chrome_junit_tests'
      ARCHIUM_RUN_HOST_GATES: 'true'
      ARCHIUM_PREVIOUS_TAG: ${{ inputs.previous_tag }}
      ARCHIUM_CHECKPOINT_TAG: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}
      ARCHIUM_CHECKPOINT_STORAGE: artifact
      # Stop compilation after 75m per stage; never run a 20-hour chain on R3.3.
      ARCHIUM_SLICE_MINUTES: '75'
      ARCHIUM_PREPARE_SECONDS: '3600'
      ARCHIUM_WORK_SECONDS: '7200'
      ARCHIUM_HOST_SECONDS: '1800'
      ARCHIUM_CHECKPOINT_SECONDS: '3600'
    outputs:
      complete: ${{ steps.compile.outputs.complete }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify available disk, exact source and checkpoint groups before transfer
        if: inputs.previous_tag != '' || inputs.source_run_id != ''
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          SOURCE_TAG: ${{ inputs.source_run_id != '' && inputs.source_tag || inputs.previous_tag }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -B1 "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/archium-predownload-artifacts.json"
          python3 - "$RUNNER_TEMP/archium-predownload-artifacts.json" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text())
          tag = os.environ['SOURCE_TAG']
          assert re.fullmatch(r'archium-checkpoint-\d+-\d+', tag), 'Checkpoint tag rejected'
          group_prefix = tag + '-'
          groups = [a for a in manifest.get('artifacts', []) if a.get('name', '').startswith(group_prefix)]
          indices = sorted(int(a['name'][len(group_prefix):]) for a in groups
                           if re.fullmatch(r'\d\d', a['name'][len(group_prefix):]))
          assert len(groups) == len(indices) and indices == list(range(len(groups))) and len(groups) > 0, 'Checkpoint groups incomplete/nonconsecutive'
          source_sha = os.environ.get('EXPECTED_SOURCE_COMMIT') or os.environ['GITHUB_SHA']
          for group in groups:
              assert not group.get('expired'), 'Expired checkpoint artifact'
              assert group.get('size_in_bytes', 0) > 0, 'Empty checkpoint artifact'
              assert group.get('digest', '').startswith('sha256:'), 'Artifact digest missing'
              assert group.get('workflow_run', {}).get('head_sha') == source_sha, 'Checkpoint source SHA mismatch'
          archive_bytes = sum(a['size_in_bytes'] for a in groups)
          stat = os.statvfs(os.environ['RUNNER_TEMP'])
          available = stat.f_frsize * stat.f_bavail
          # Preserve the run-4 proven 75 GB post-download headroom; include ZIP transfer bytes.
          required = 75_000_000_000 + archive_bytes
          print(f'CHECKPOINT_PREDOWNLOAD groups={len(groups)} source_sha={source_sha} archive_bytes={archive_bytes} available={available} required={required}', flush=True)
          if available < required:
              raise SystemExit('CHECKPOINT_PREDOWNLOAD_DISK=FAIL: insufficient disk BEFORE download')
          print('CHECKPOINT_PREDOWNLOAD_DISK=PASS', flush=True)
          PY
      - name: Download complete checkpoint artifact groups
        if: inputs.previous_tag != '' || inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.source_run_id != '' && format('{0}-*', inputs.source_tag) || format('{0}-*', inputs.previous_tag) }}
          run-id: ${{ inputs.source_run_id != '' && fromJSON(inputs.source_run_id) || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/archium-checkpoint
      - name: Restore checkpoint and prepare Chromium
        timeout-minutes: 62
        env:
          ARCHIUM_CHECKPOINT_DIR: ${{ runner.temp }}/archium-checkpoint
        run: bash scripts/build-archium.sh --prepare
      - name: Compile, run gates and checkpoint
        id: compile
        env:
          ARCHIUM_CHECKPOINT_DIR: ${{ runner.temp }}/archium-checkpoint
        run: bash scripts/build-archium.sh --work
      - name: Upload checkpoint artifact group 00
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-00
          path: ${{ runner.temp }}/archium-checkpoint/group-00/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 01
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-01
          path: ${{ runner.temp }}/archium-checkpoint/group-01/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 02
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-02
          path: ${{ runner.temp }}/archium-checkpoint/group-02/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 03
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-03
          path: ${{ runner.temp }}/archium-checkpoint/group-03/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 04
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-04
          path: ${{ runner.temp }}/archium-checkpoint/group-04/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 05
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-05
          path: ${{ runner.temp }}/archium-checkpoint/group-05/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 06
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-06
          path: ${{ runner.temp }}/archium-checkpoint/group-06/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Upload checkpoint artifact group 07
        if: ${{ always() && steps.compile.outputs.complete == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: archium-checkpoint-${{ github.run_id }}-${{ inputs.stage }}-07
          path: ${{ runner.temp }}/archium-checkpoint/group-07/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Save completed APK
        timeout-minutes: 30
        if: steps.compile.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Archium-for-Android-arm64
          path: archium-output/
          if-no-files-found: error
          retention-days: 7
