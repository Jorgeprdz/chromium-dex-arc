name: Archium R3.3 guarded host preflight
on:
  push:
    branches:
      - assistant/archium-r3-visual-fixes
    paths:
      - 'chromium/**'
      - 'scripts/**'
      - 'tests/**'
      - 'patches/**'
      - 'assets/branding/archium/**'
      - '.github/workflows/archium-r3-preflight.yml'
      - '.github/workflows/baseline-build.yml'
      - '.github/workflows/archium-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Media GN with pinned depot_tools and error reporting
        shell: bash
        env:
          DEPOT_TOOLS_REV: 8a5434051036b32412a2ecb10c213a72e3f3ccb9
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" fetch --depth=1 origin "$DEPOT_TOOLS_REV"
          git -C "$RUNNER_TEMP/depot_tools" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/depot_tools" rev-parse HEAD)" = "$DEPOT_TOOLS_REV"
          "$RUNNER_TEMP/depot_tools/ensure_bootstrap"
          GN="$RUNNER_TEMP/depot_tools/gn"
          test -x "$GN"
          echo "ARCHIUM_TEST_GN=$GN" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/archium-gn-diagnostics"
          echo "ARCHIUM_GN_DIAGNOSTICS_DIR=$RUNNER_TEMP/archium-gn-diagnostics" >> "$GITHUB_ENV"
          "$GN" --version
          ARCHIUM_TEST_GN="$GN" ARCHIUM_GN_DIAGNOSTICS_DIR="$RUNNER_TEMP/archium-gn-diagnostics" \
            python3 -m unittest discover -s tests -p 'test_media_config.py' -v
      - name: Retain GN fixture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archium-media-gn-diagnostics
          path: ${{ runner.temp }}/archium-gn-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Python syntax and host gates
        run: |
          python3 -m py_compile scripts/integrate-archium-portal.py scripts/verify-archium-portal-apk.py scripts/archium_portal_content_gate.py scripts/archium-checkpoint.py scripts/check_portal_aapt2_fixture.py scripts/generate-arc-patch.py scripts/check-arc-preparation.py
          python3 -m unittest discover -s tests -p 'test_archium_portal_resources.py' -v
          python3 -m unittest discover -s tests -p 'test_arc_visual_static_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_r3_3_resource_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_r3_3_incremental_boundaries.py' -v
          python3 -m unittest discover -s tests -p 'test_archium_native_link_and_checkpoint_regression.py' -v
          python3 -m unittest discover -s tests -p 'test_archium_checkpoint_restore_disk.py' -v
      - name: Install Android 36 SDK for isolated adapter javac
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --install 'platforms;android-36' > /dev/null || {
            test -s "${ANDROID_HOME}/platforms/android-36/android.jar"
          }
          test -s "${ANDROID_HOME}/platforms/android-36/android.jar"
      - name: Compile isolated Portal resource fixture with genuine Android AAPT2
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          if [[ ! -x "$AAPT2" ]]; then
            yes | "$SDKMANAGER" --install 'build-tools;36.0.0' > /dev/null || test -x "$AAPT2"
          fi
          test -x "$AAPT2"
          python3 scripts/check_portal_aapt2_fixture.py --android-jar "${ANDROID_HOME}/platforms/android-36/android.jar" --aapt2 "$AAPT2"
      - name: Execute full sparse preparation with pinned Window Core
        run: |
          python3 scripts/check-arc-preparation.py --android-jar "${ANDROID_HOME}/platforms/android-36/android.jar"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check workflow definitions using pinned actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/archium-r3-preflight.yml \
            .github/workflows/archium-branding.yml \
            .github/workflows/baseline-build.yml \
            .github/workflows/archium-stage.yml
      - name: Reproduce official Chromium patch and manifest twice, byte-for-byte
        run: |
          python3 scripts/generate-arc-patch.py
          git diff --exit-code -- patches/archium-desktop.patch patches/upstream-files.json
          sha256sum patches/archium-desktop.patch patches/upstream-files.json > /tmp/archium-first-sha256
          python3 scripts/generate-arc-patch.py
          sha256sum patches/archium-desktop.patch patches/upstream-files.json > /tmp/archium-second-sha256
          cmp /tmp/archium-first-sha256 /tmp/archium-second-sha256
          git diff --exit-code -- patches/archium-desktop.patch patches/upstream-files.json
      - name: Verify build shell and protect branch isolation
        run: |
          bash -n scripts/build-archium.sh
          bash -n scripts/build-baseline.sh
          bash -n scripts/dispatch-archium-r3-1-build.sh
          test "$GITHUB_REF_NAME" = "assistant/archium-r3-visual-fixes"
          test "$(grep -c 'scripts/integrate-archium-portal.py' scripts/build-archium.sh)" -eq 3
          echo "R3.3 host preflight only; no automated native build dispatch; APK and DeX pending."
