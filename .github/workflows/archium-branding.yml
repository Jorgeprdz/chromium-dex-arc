name: Archium Portal read-only branding audit
on:
  push:
    branches:
      - assistant/archium-r3-visual-fixes
    paths:
      - 'scripts/export-archium-icons.py'
      - 'scripts/integrate-archium-portal.py'
      - 'assets/branding/archium/**'
      - '.github/workflows/archium-branding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-approved-artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify approved masters and PNGs without exporting or publishing
        run: |
          python3 -m unittest discover -s tests -p 'test_archium_portal_resources.py' -v
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          s = importlib.util.spec_from_file_location("portal", "scripts/integrate-archium-portal.py")
          m = importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          m.approved_assets()
          p = Path("assets/branding/archium")
          assert len(list(p.glob("archium-*.png"))) == 29
          assert len(list(p.glob("archium-*.svg"))) == 7
          print("Original Portal artwork verified; exporter was NOT executed.")
          PY
